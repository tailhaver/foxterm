name: Deploy to dev server (https://dev.yip.cat)
on:
  push:
    branches: [ dev ]

jobs:
    deploy-dev:
        name: deploy-dev
        runs-on: ubuntu-latest
        steps:
          - name: Execute remote SSH commands using SSH key
            uses: appleboy/ssh-action@v1
            with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                port: ${{ secrets.PORT }}
                script: deploy-dev.sh
