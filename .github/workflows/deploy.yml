name: test for deploy action
on:
  push:
    branches: [ dev ]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
          - name: deploy
            uses: appleboy/ssh-action@master
            with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                port: ${{ secrets.PORT }}
                script: whoami
